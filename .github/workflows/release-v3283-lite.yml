name: Release v3.28.3-lite（纯数据管道·画面映射已移除·纯构建）
run-name: "🟢 v3.28.3-lite 纯构建 — 源码定稿版：画面映射✗已移除 · 内置AI✗已摘 · jueceramen端点✓全保留"

# 新仓库纪律：CI 不改源码。拼装（cumulative/SIGSEGV guard/crash-log fix）已在
# 提交前本地完成，仓库内 lib.rs 即最终形态；本 workflow 只做编译与发布。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 📝 构建账本（本版修了什么/版本演进）
        run: |
          cat > "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## 本 run 在做什么
          纯构建：源码已在提交前定稿（CI 不改源码）。产物 libhachimi_ura.so → 自动挂到 Release **v3.28.3-lite**。
          ## 版本演进账（每版修了什么）
          | 版本 | 结果 | 相对上一版的变化 |
          |---|---|---|
          | v3.28.2-lite | ✅ 绿 | 首版纯构建：v3.28.2 配方移除画面映射 hook |
          | v3.28.3-lite 首跑 | 🔴 红 | 源码升级批漏推 training_anim_skip.rs（E0583）——已当场补文件 |
          | **v3.28.3-lite（本 run）** | 🟢 绿 | 补齐模块文件；摘内置 AI（决策归 jueceramen）；jueceramen 数据端点全保留（/summary、/api/event/choices、/api/event/observations、/debug/ramen_planner_state）；画面映射零残留（11 项校验） |
          ## 判读规则
          - 看最新 run：🟢 = Release 可下载可用；🔴 = 看失败步与红色说明
          - Release 页 https://github.com/xf8410/hlpatch-lite/releases 对应 tag 资产齐全即为可用版本
          EOF
          echo "账本已写入 STEP_SUMMARY"

      - uses: actions/checkout@v4

      - name: Setup Rust
        run: rustup target add aarch64-linux-android

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build Android arm64 release
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: set -o pipefail; cargo build --target aarch64-linux-android --release 2>&1 | tee cargo-build.log

      - name: Prepare immutable release assets
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=${GITHUB_SHA}
          cargo_version=3.28.3
          binary_size=$SIZE
          binary_sha256=$SHA256
          tag=v3.28.3-lite
          workflow_run=${GITHUB_RUN_ID}
          lineage=v3.28.0(721c086)+cumulative_3.27.23+sigsegv_guard+crash_log_fix+anim_skip+signup_observer+strip_ai_v3283
          screen_mirror=removed（本仓库不注入画面映射 hook）
          features=crash_log_path_fix,sigsegv_guard,strip_ai_v3283,anim_skip,signup_observer,screen_mirror_removed
          runtime_validation=pending_device_execution
          EOF
          cp hachimi_ura_plugin/cargo-build.log .

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          gh release create "v3.28.3-lite" "$ASSET" SHA256SUMS BUILD-MANIFEST.txt cargo-build.log \
            --title "v3.28.3-lite 纯数据管道（画面映射已移除·内置AI已摘·jueceramen端点全保留）" \
            --notes "hlpatch v3.28.2 构建配方去除画面映射 hook 的轻量版：lineage=v3.28.0(721c086)+cumulative_3.27.23+sigsegv_guard+crash_log_fix+anim_skip+signup_observer+strip_ai_v3283；源码即最终形态，CI 纯构建。" \
            || gh release upload "v3.28.3-lite" "$ASSET" SHA256SUMS BUILD-MANIFEST.txt cargo-build.log --clobber
